      - name: Tg Release
        continue-on-error: true
        id: tg_success
        if: ${{ steps.publish_summary.outcome == 'success' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          message: |
            ${{ steps.publish_summary.outputs.status }} React Native `${{ steps.version_tag.outputs.VERSION }}` release
            published ${{ steps.publish_summary.outputs.published }} / ${{ steps.publish_summary.outputs.total }}
            ${{ steps.publish_summary.outputs.details }}

            [Changelog](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)

      - name: Release
        if: ${{ !contains(github.event.ref, '-') }}
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Affise Attribution React Native Library ${{ github.ref }}
          draft: false
          prerelease: false
