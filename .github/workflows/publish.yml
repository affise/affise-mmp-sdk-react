        run: npm publish

      - name: Publish Beta module-phone
        if: contains(github.event.ref, '-beta')
        working-directory: affise-attribution-module-phone
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # skip for OIDC
        run: npm publish --tag beta

      # Package affise-attribution-module-rustore
      - name: NPM Install
        working-directory: affise-attribution-module-rustore
        run: npm install

      - name: Publish module-rustore
        if: ${{ !contains(github.event.ref, '-') }}
        working-directory: affise-attribution-module-rustore
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # skip for OIDC
        run: npm publish

      - name: Publish Beta module-rustore
        if: contains(github.event.ref, '-beta')
