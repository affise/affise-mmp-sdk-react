name: 🏗️ Publish
run-name: Publish ${{ github.ref_name }}

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  id-token: write  # Required for OIDC
  contents: write  # Grant write permissions for the GITHUB_TOKEN

jobs:
  publish:
    name: Publish Affise Library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Version Tag
        id: version_tag
        run: |
          echo Version: ${GITHUB_REF_NAME}
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
    
      - name: Setup NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: 'https://registry.npmjs.org'

      - name: NPM Token
        run: |
          npm config set //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}

      - name: NPM Token Check
        run: |
          npm whoami

      - name: Invalid Token
        id: token_invalid
        if: ${{ failure() }}
        run: echo "Invalid NPM Token"

      - name: Tg Token Invalid
        continue-on-error: true
        id: tg_npm_failed
        if: ${{ failure() }}
        uses: cbrgm/telegram-github-action@v1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          parse-mode: markdown
          disable-web-page-preview: true
          message: |
            ‼️ NPM token is invalid ‼️

            [Github Action](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Get npm cache directory
        id: npm-cache
        run: |
          echo "NPM_CACHE=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.npm-cache.outputs.NPM_CACHE }}
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # Package affise-attribution-lib
      - name: NPM Install
        working-directory: affise-attribution-lib
        run: npm ci

      - name: Publish attribution-lib
        id: publish_release_attribution_lib
        if: ${{ !contains(github.event.ref, '-') }}
        working-directory: affise-attribution-lib
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # skip for OIDC
        run: npm publish

      - name: Publish Beta attribution-lib
        id: publish_beta_attribution_lib
        if: contains(github.event.ref, '-beta')
        working-directory: affise-attribution-lib
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # skip for OIDC
        run: npm publish --tag beta

