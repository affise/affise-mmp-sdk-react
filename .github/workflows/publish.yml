        working-directory: affise-attribution-module-adservice
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # skip for OIDC
        run: npm publish --tag beta

      # Package affise-attribution-module-advertising
      - name: NPM Install
        working-directory: affise-attribution-module-advertising
