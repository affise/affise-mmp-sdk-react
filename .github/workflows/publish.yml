        run: npm publish --tag beta

      - name: Summarize npm publication
        id: publish_summary
        if: ${{ steps.publish_release_attribution_lib.outcome == 'success' || steps.publish_beta_attribution_lib.outcome == 'success' }}
        env:
          PUBLISH_STEPS: ${{ toJSON(steps) }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const steps = JSON.parse(process.env.PUBLISH_STEPS);
          const isBeta = steps.publish_beta_attribution_lib?.outcome === 'success';
          const prefix = isBeta ? 'publish_beta_' : 'publish_release_';
          const packages = Object.entries(steps).filter(([id]) => id.startsWith(prefix));
          const notPublished = [];

          for (const [id, { outcome }] of packages) {
            if (outcome === 'success') continue;

            const key = id.slice(prefix.length);
            const name = key.replaceAll('_', '-');
            const reason = steps['install_' + key]?.outcome === 'failure'
              ? 'install failed'
              : outcome === 'failure' ? 'publish failed' : 'skipped';
            notPublished.push(name + ' (' + reason + ')');
          }

          const published = packages.length - notPublished.length;
          const status = notPublished.length === 0 ? '🟢' : '🟡';
          const details = notPublished.length === 0 ? '' : 'Not published: ' + notPublished.join('; ');
          appendFileSync(process.env.GITHUB_OUTPUT,
            'status=' + status + '\n' +
            'published=' + published + '\n' +
            'total=' + packages.length + '\n' +
            'details=' + details + '\n');
          NODE

      - name: Tg Release failed
        continue-on-error: true
        id: tg_failed
        if: ${{ steps.token_invalid.outcome == 'skipped' && failure() }}
        uses: appleboy/telegram-action@master
        with:
